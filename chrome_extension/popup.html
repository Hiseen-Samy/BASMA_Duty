<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 330px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b1120;
      color: #f8fafc;
      font-size: 13px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 800;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: .3s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(16px); }

    .desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.4;
      margin-bottom: 14px;
    }
    .field {
      margin-bottom: 10px;
    }
    .field label {
      display: block;
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      color: #38bdf8;
      font-family: monospace;
      font-size: 13px;
      font-weight: bold;
      direction: ltr;
      box-sizing: border-box;
      outline: none;
    }
    .field input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }
    .presets-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }
    .btn-preset {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: #cbd5e1;
      padding: 5px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .btn-preset:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border-color: #38bdf8;
    }
    .btn-primary {
      width: 100%;
      background: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 12.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: all 0.2s;
    }
    .btn-primary:hover {
      filter: brightness(1.1);
    }
    .status-alert {
      margin-top: 10px;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    .status-alert.success {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-bar {
      margin-top: 12px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
      line-height: 1.3;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🛰️ محاكي GPS كروم</div>
    <div class="toggle-wrap">
      <span id="toggleText">مفعل</span>
      <label class="switch">
        <input type="checkbox" id="chkEnable" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <p class="desc">يعمل تلقائياً على كامل متصفح كروم ويغذي صفحات البصمة بموقعك المعتمد بدون الحاجة لأي ربط خارجي.</p>

  <div class="field">
    <label>خط العرض (Latitude):</label>
    <input type="text" id="latInput" value="31.217653">
  </div>

  <div class="field">
    <label>خط الطول (Longitude):</label>
    <input type="text" id="lonInput" value="29.945706">
  </div>

  <!-- خيارات سريعة -->
  <div class="presets-row">
    <button class="btn-preset" id="presetAlex">📍 الإسكندرية (المقر)</button>
    <button class="btn-preset" id="presetCairo">📍 القاهرة</button>
    <button class="btn-preset" id="presetNatrun">📍 الصحراوي</button>
  </div>

  <button class="btn-primary" id="btnSave">💾 حفظ وتطبيق على كامل كروم</button>

  <div class="status-alert success" id="statusBox">
    ✓ تم التطبيق! أي صفحة تفتحها ستعتمد هذا الموقع فوراً.
  </div>

  <div class="badge-bar">
    يعمل داخلياً 100% في المتصفح • بدون اتصالات بالشبكة
  </div>

  <script src="popup.js"></script>
</body>
</html>
